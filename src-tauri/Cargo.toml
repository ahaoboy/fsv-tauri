[package]
name = "fsv-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fsv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fsv = "0.1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "28", features = ["legacy_storage_permission"] , git="https://github.com/aiueo13/tauri-plugin-android-fs"}
jni = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
# tauri-plugin-media = { version = "0.1" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-single-instance = { version = "2" }
